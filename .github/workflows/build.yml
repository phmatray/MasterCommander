# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build & Test

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ '*' ]

env:
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    
    ###################################################
    # BUILD
    ###################################################
    
    build:
        name: Build
        if: "!contains(github.event.head_commit.message, 'skip-ci')"
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: |
                      10.0.x

            - name: 'Cache: .nuke/temp, ~/.nuget/packages'
              uses: actions/cache@v5
              with:
                  path: |
                      .nuke/temp
                      ~/.nuget/packages
                  key: ${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}

            # Validate is the default target: restore, build, test, pack, then run the NuGet package
            # validator over what came out. It deliberately stops short of publishing.
            # `dotnet tool restore` now happens inside the target, next to the tool that needs it.
            - name: Build
              shell: bash
              run: ./build.sh Validate

            - name: Upload Verify Test Results
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: verify-test-results
                  path: |
                      **/*.received.*
