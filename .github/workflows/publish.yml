# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish

on:
    push:
        tags:
            - '*'
        branches:
            - main

env:
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    
    ###################################################
    # PUBLISH
    ###################################################
    
    build:
        name: Publish NuGet Packages
        if: "!contains(github.event.head_commit.message, 'skip-ci') || startsWith(github.ref, 'refs/tags/')"
        runs-on: ubuntu-latest
        # Minimal on purpose: the build's Publish target only pushes to nuget.org, so nothing here
        # needs write access to the repository. id-token is what Trusted Publishing exchanges.
        permissions:
            contents: read
            id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: |
                      10.0.x

            - name: 'Cache: .nuke/temp, ~/.nuget/packages'
              uses: actions/cache@v5
              with:
                  path: |
                      .nuke/temp
                      ~/.nuget/packages
                  key: ${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}

            # Trusted Publishing: exchanges the OIDC token for a NuGet key valid ~1 hour, so no
            # long-lived secret is stored. Nuke neither knows nor cares that the key is short-lived
            # — it just receives one through the NuGetApiKey parameter. Keep this adjacent to the
            # publish step below so the key cannot expire in between.
            # Requires a Trusted Publishing policy on nuget.org for MasterCommander naming this
            # repository and publish.yml, plus the NUGET_USER secret (the nuget.org profile name).
            - name: NuGet login (OIDC -> short-lived key)
              id: nuget-login
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              with:
                  user: ${{ secrets.NUGET_USER }}

            # Publish depends on Validate, so the package is still built, tested and validated on
            # this same run before anything is pushed — the ordering the Cake script had.
            - name: Publish
              shell: bash
              run: ./build.sh Publish
              env:
                  NuGetApiKey: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
